# Cloudflare Pages project config (bindings for functions/). Deploy with: sh scripts/deploy.sh
name = "siorbaty-mozhna"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-01"

[vars]
# Sender for verification / reset emails. The domain must be onboarded to Cloudflare Email Sending.
MAIL_FROM = "Сьорбати Можна <noreply@siorbaty-mozhna.com>"
# Secrets (set with `npx wrangler pages secret put NAME --project-name siorbaty-mozhna`):
#   CF_ACCOUNT_ID, CF_EMAIL_TOKEN (API token with Email Sending permission).
# Without CF_EMAIL_TOKEN the links are only logged (local dev: printed by `wrangler pages dev`).

[[d1_databases]]
binding = "DB"
database_name = "siorbaty-auth"
database_id = "9b199089-c8a3-4218-8989-aa1eafda016a"
migrations_dir = "migrations"
