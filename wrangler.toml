# Cloudflare Pages project config (bindings for functions/). Deploy with: sh scripts/deploy.sh
name = "siorbaty-mozhna"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-01"

[vars]
# Sender for verification / reset emails, sent through Resend (resend.com). The domain must be verified there.
MAIL_FROM = "Сьорбати Можна <noreply@siorbaty-mozhna.com>"
# Hosts where the course needs a login. *.pages.dev redirects to siorbaty-mozhna.com (functions/_middleware.js).
AUTH_HOSTS = "siorbaty-mozhna.com,www.siorbaty-mozhna.com,localhost"
# Secret (set with `npx wrangler pages secret put RESEND_API_KEY --project-name siorbaty-mozhna`): RESEND_API_KEY.
# Without it the links are only logged (local dev: printed by `wrangler pages dev`).
# Telegram user IDs allowed to manage students through the bot (functions/api/telegram.js), comma-separated.
# Its webhook secret TELEGRAM_SECRET is set by scripts/telegram-setup.sh.
TELEGRAM_ADMINS = "368361854"

[[d1_databases]]
binding = "DB"
database_name = "siorbaty-auth"
database_id = "9b199089-c8a3-4218-8989-aa1eafda016a"
migrations_dir = "migrations"
